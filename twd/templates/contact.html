{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - TWD</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --muted: #6b7280;
            --primary: #2563eb;
            --text: #07102a;
            --border: #e6edf5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 32px;
        }

        .nav_div { text-align: center; margin-bottom: 24px; }
        .nav_head { font-size: 1.6rem; margin: 0; }
        .tagline { font-size: 13px; color: var(--muted); display: block; margin-top: 4px; }

        .head { text-align: center; font-size: 1.4rem; margin: 0 0 24px; }

        .main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { border: 1px solid var(--border); padding: 20px; text-align: center; }
        .label { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
        .value { margin: 0; font-weight: 700; }

        @media (max-width: 600px) {
            .container { margin: 0; padding: 20px; }
            .main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav_div">
        <nav class="nav">
            <h1 class="nav_head">TWD <span class="tagline">The World of Discovery</span></h1>
        </nav>
    </div>

    <h1 class="head">Contact Us</h1>
    <div class="main">
        <div class="card">
            <h2 class="label">Ph No</h2>
            <p class="value">+91 9539716778</p>
        </div>
        <div class="card">
            <h2 class="label">Email</h2>
            <p class="value">mohammaddilshan217@gmail.com</p>
        </div>
    </div>
</div>
</body>
</html>
