<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWD</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --primary: #2563eb;
            --accent: #06b6d4;
            --text: #07102a;
            --border: #e6edf5;
        }

        body {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 32px;
            text-align: center;
        }

        .card h1 { margin: 0 0 20px; font-size: 18px; }

        .button-row { display: flex; gap: 12px; }

        .button {
            display: inline-block;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .login-button { background: var(--primary); border-color: var(--primary); }
        .login-button:hover { opacity: 0.9; }

        .register-button { background: transparent; color: var(--primary); border-color: var(--primary); }
        .register-button:hover { background: var(--primary); color: #ffffff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Continue as a vendor</h1>
        <div class="button-row">
            <a href="{% url 'vendorlogin' %}" class="button login-button">Login</a>
            <a href="{% url 'vendorsignup' %}" class="button register-button">Register</a>
        </div>
    </div>
</body>
</html>
