{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile</title>

<style>
  :root {
    --bg: #f6f8fb;
    --card: #ffffff;
    --muted: #6b7280;
    --primary: #2563eb;
    --text: #07102a;
    --border: #e6edf5;
  }

  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background: var(--bg);
    color: var(--text);
    margin: 0;
  }

  .wrap {
    max-width: 480px;
    margin: 48px auto;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 28px;
  }

  h2 { margin: 0 0 20px; font-size: 18px; }

  .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }

  label { font-weight: 700; font-size: 13px; margin-bottom: 6px; }

  input {
    padding: 10px 12px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-family: inherit;
  }

  input:focus { outline: none; border-color: var(--primary); }

  .actions { margin-top: 20px; display: flex; justify-content: space-between; }

  .btn { padding: 10px 16px; border: 1px solid transparent; font-weight: 700; font-size: 14px; text-decoration: none; }

  .primary { background: var(--primary); color: #ffffff; }
  .primary:hover { opacity: 0.9; }

  .secondary { background: transparent; color: var(--muted); border-color: var(--border); }
  .secondary:hover { color: var(--text); }

  @media (max-width: 600px) {
    .wrap { margin: 0; }
  }
</style>
</head>

<body>

<div class="wrap">
  <h2>Edit Profile</h2>

  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label>Username</label>
      {{ form.username }}
    </div>

    <div class="form-group">
      <label>Email</label>
      {{ form.email }}
    </div>

    <div class="form-group">
      <label>Phone</label>
      {{ form.phone }}
    </div>

    <div class="actions">
      <a href="{% url 'profile' %}" class="btn secondary">Cancel</a>
      <button type="submit" class="btn primary">Save Changes</button>
    </div>

  </form>
</div>

</body>
</html>
