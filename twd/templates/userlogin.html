{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TWD</title>
    <link rel="stylesheet" href="{% static 'css/userlogin.css' %}">

    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --muted: #6b7280;
            --primary: #2563eb;
            --accent: #06b6d4;
            --text: #07102a;
            --border: #e6edf5;
            --danger: #b91c1c;
            --max-width: 480px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 28px;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap { max-width: var(--max-width); margin: 28px auto; background: var(--card); border: 1px solid var(--border); }

        .header { padding: 20px 24px; border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 12px; }
        .logo { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--primary); color: #ffffff; font-weight: 800; flex-shrink: 0; }
        .brand h1 { margin: 0; font-size: 18px; }
        .hint { color: var(--muted); font-size: 13px; }

        .form-card { padding: 24px; }
        .form-card h2 { margin: 0 0 16px; font-size: 18px; }
        .errors { margin-bottom: 14px; padding: 10px 12px; border: 1px solid var(--danger); color: var(--danger); font-size: 13px; }

        .frm p { display: flex; flex-direction: column; gap: 6px; margin: 0 0 16px; }
        .frm label { font-weight: 700; font-size: 13px; }
        .frm input, .frm select, .frm textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); background: #ffffff; color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
        .frm input:focus, .frm select:focus, .frm textarea:focus { border-color: var(--primary); }
        .frm .helptext { color: var(--muted); font-size: 12px; }
        .frm .errorlist { margin: 0; padding: 0; list-style: none; color: var(--danger); font-size: 12px; }

        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { padding-right: 64px; }
        .pw-toggle { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); padding: 4px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 700; }
        .pw-toggle:hover { color: var(--primary); }

        .lg { display: block; width: 100%; padding: 10px 16px; border: 1px solid var(--primary); background: var(--primary); color: #ffffff; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px; }
        .lg:hover { opacity: 0.9; }

        .signup-link { margin: 16px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
        .signup-link a { color: var(--primary); text-decoration: none; font-weight: 700; }
        .signup-link a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .wrap { margin: 0; }
        }
    </style>
</head>

<body>
    <div class="wrap" role="main">

        <header class="header">
            <div class="brand">
                <div class="logo">TWD</div>
                <div>
                    <h1>User Login</h1>
                    <div class="hint">Sign in to access your TWD account.</div>
                </div>
            </div>
        </header>

        <section class="form-card" aria-labelledby="login-heading">
            <h2 id="login-heading">Welcome back</h2>

            {% if form.non_field_errors %}
                <div class="errors">{{ form.non_field_errors }}</div>
            {% endif %}

            <form class="frm" method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}

                <button class="lg" type="submit">Login</button>

                <p class="signup-link">
                    Don't have an account? <a href="{% url 'signup' %}">Create one</a>
                </p>
            </form>
        </section>
    </div>

    <script>
        document.querySelectorAll("input[type='password']").forEach(function (input) {
            const parent = input.parentNode;
            parent.classList.add("password-wrapper");
            const button = document.createElement("button");
            button.type = "button";
            button.classList.add("pw-toggle");
            button.textContent = "Show";
            button.setAttribute("aria-label", "Show or hide password");
            parent.appendChild(button);
            button.addEventListener("click", function () {
                const hidden = input.type === "password";
                input.type = hidden ? "text" : "password";
                button.textContent = hidden ? "Hide" : "Show";
            });
        });
    </script>
</body>
</html>
