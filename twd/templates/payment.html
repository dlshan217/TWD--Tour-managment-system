{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment — TWD</title>

  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --muted: #6b7280;
      --primary: #2563eb;
      --text: #07102a;
      --border: #e6edf5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap { max-width: 480px; margin: 28px auto; }

    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--primary); color: #ffffff; font-weight: 800; flex-shrink: 0; }
    .brand h1 { margin: 0; font-size: 16px; }
    .brand div div { font-size: 13px; color: var(--muted); }
    .topbar a { text-decoration: none; color: var(--muted); font-size: 13px; }
    .topbar a:hover { color: var(--primary); }

    .card { background: var(--card); border: 1px solid var(--border); padding: 24px; }

    .merchant { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .avatar { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--primary); color: #ffffff; font-weight: 800; font-size: 13px; flex-shrink: 0; }
    .merchant div div:first-child { font-weight: 800; }
    .merchant div div:last-child { font-size: 13px; color: var(--muted); }

    .note { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: center; }
  </style>
</head>

<body>
  <div class="wrap">

    <header class="topbar">
      <div class="brand">
        <div class="logo">TWD</div>
        <div>
          <h1>Checkout</h1>
          <div>Secure payment via Razorpay</div>
        </div>
      </div>

      <a href="{% url 'userhome' %}">Continue browsing</a>
    </header>

    <main class="card">

      <div class="merchant">
        <div class="avatar">TWD</div>
        <div>
          <div>TWD — Travel &amp; Tours</div>
          <div>Payments processed securely</div>
        </div>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="btn-razor">
          <script
            src="https://checkout.razorpay.com/v1/payment-button.js"
            data-payment_button_id="pl_QMuZb9R8wIFeE3"
            async>
          </script>
        </div>
      </form>

      <div class="note">
        After successful payment, your booking will be confirmed automatically.
      </div>

    </main>
  </div>
</body>
</html>
