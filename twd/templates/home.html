{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home - TWD</title>

<style>
    :root {
        --bg: #f6f8fb;
        --card: #ffffff;
        --muted: #6b7280;
        --primary: #2563eb;
        --accent: #06b6d4;
        --text: #07102a;
        --border: #e6edf5;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
        background: var(--card);
        border: 1px solid var(--border);
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 32px;
        border-bottom: 1px solid var(--border);
    }

    .logo { font-size: 22px; font-weight: 800; margin: 0; color: var(--primary); }
    .tagline { font-size: 13px; color: var(--muted); margin-top: 2px; }

    .nav_ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 8px; }
    .nav_link { text-decoration: none; color: var(--text); font-weight: 700; padding: 8px 16px; border: 1px solid var(--border); font-size: 14px; }
    .nav_link:hover { background: var(--primary); color: #ffffff; border-color: var(--primary); }

    .section_one { text-align: center; padding: 40px 24px 24px; }
    .heading-container { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .hed { font-size: 2.2rem; margin: 0; }
    .hed2 { font-size: 2.2rem; margin: 0; color: var(--primary); }

    .img_section img { width: 100%; height: 420px; object-fit: cover; display: block; }

    .ab_section { text-align: center; padding: 32px 24px; border-top: 1px solid var(--border); }
    .ab_head { font-size: 16px; color: var(--muted); margin: 0; font-weight: 400; }

    .footer { text-align: center; padding: 20px; font-size: 13px; color: var(--muted); }

    .bottom-nav { display: none; }

    @media (max-width: 768px) {
        .header { flex-direction: column; text-align: center; gap: 14px; padding: 16px; }
        .logo { font-size: 20px; }
        .nav_ul { display: none; }
        .hed, .hed2 { font-size: 1.5rem; }
        .img_section img { height: 220px; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
        }

        .bottom-nav a { text-decoration: none; color: var(--text); font-weight: 700; font-size: 14px; }

        body { padding-bottom: 60px; }
    }
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div>
      <h1 class="logo">TWD</h1>
      <div class="tagline">The World of Discovery</div>
    </div>

    <ul class="nav_ul">
      <li><a class="nav_link" href="{% url 'signup' %}">Client</a></li>
      <li><a class="nav_link" href="{% url 'vendorsignup' %}">Vendor</a></li>
    </ul>
  </header>

  <section class="section_one">
    <div class="heading-container">
      <h1 class="hed">Make your trip</h1>
      <h1 class="hed2">Unforgettable.</h1>
    </div>
  </section>

  <section class="img_section">
    <img src="https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=2000&q=80" alt="TWD Banner" />
  </section>

  <section class="ab_section">
    <h2 class="ab_head">
      "Traveling – it leaves you speechless, then turns you into a storyteller." – Ibn Battuta
    </h2>
  </section>

  <div class="footer">© TWD — The World of Discovery</div>

</div>

<nav class="bottom-nav">
  <a href="{% url 'signup' %}">Client</a>
  <a href="{% url 'vendorsignup' %}">Vendor</a>
</nav>

</body>
</html>
